<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
阳光高考平台XSS漏洞复现演示
<style>
*{margin: 0;padding: 0;box-sizing: border-box;}
.box{width: 500px;margin: 100px auto;text-align: center;}
.title{font-size: 20px;margin-bottom: 20px;color: #333;}
.input-box{margin: 20px 0;}
input{width: 100%;height: 40px;padding: 0 10px;border: 1px solid #ccc;border-radius: 4px;}
button{width: 120px;height: 40px;background: #1976d2;color: #fff;border: none;border-radius: 4px;cursor: pointer;}
.tip{margin-top: 20px;color: red;}
</style>
</head>
<body>
<div class="box">
<h2 class="title">平台注册-安全邮箱填写（漏洞复现）</h2>
<div class="input-box">
<input type="text" id="email" placeholder="请输入安全邮箱（此处存在XSS漏洞）">
</div>
<button onclick="submitData()">提交注册信息</button>
<div class="tip">漏洞说明：输入JS脚本可直接执行，无过滤转义</div>

<!-- 模拟后端存储数据并前端直接渲染（漏洞核心点） -->
<div id="showData" style="margin-top: 30px;"></div>
</div>

<script>
// 模拟提交数据、存储数据、前端直接渲染（复刻网站漏洞逻辑）
function submitData(){
let emailVal = document.getElementById('email').value;
// 漏洞核心：无任何过滤，直接将用户输入内容插入页面DOM
document.getElementById('showData').innerHTML = "您填写的安全邮箱：" + emailVal;
}
</script>
</body>
</html>
